<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TT11 Tracker</title>
<meta name="description" content="Table tennis match tracker for Adam and Dave.">

<meta name="theme-color" content="#0B0B0C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="TT11">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">TT11</span>
      <span class="brand-sub">Tracker</span>
    </div>
    <button class="icon-btn" id="status-btn" type="button" aria-label="Connection status">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="status-icon">
        <path d="M2 8.5a15 15 0 0 1 20 0"></path>
        <path d="M5.5 12a10 10 0 0 1 13 0"></path>
        <path d="M9 15.5a5 5 0 0 1 6 0"></path>
        <circle cx="12" cy="19" r="1.2" fill="#FFFFFF" stroke="none"></circle>
      </svg>
    </button>
  </header>

  <main id="views">
    <section id="view-home" class="view" data-view="home"></section>
    <section id="view-log" class="view" data-view="log" hidden></section>
    <section id="view-history" class="view" data-view="history" hidden></section>
    <section id="view-stats" class="view" data-view="stats" hidden></section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <nav class="bottom-nav">
    <button class="nav-item" data-target="home" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"></path><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"></path></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" data-target="log" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>
      <span>Log</span>
    </button>
    <button class="nav-item" data-target="history" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg>
      <span>History</span>
    </button>
    <button class="nav-item" data-target="stats" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V10M12 19V5M19 19v-7"></path></svg>
      <span>Stats</span>
    </button>
  </nav>

</div>

<script src="app.js" defer></script>
</body>
</html>
