name = "tt11-tracker"
compatibility_date = "2026-09-01"
pages_build_output_dir = "public"

# One R2 object per match — see functions/_lib/matches.js for the key/metadata
# scheme. Create the bucket first with `wrangler r2 bucket create tt11-tracker-matches`
# (see README step 1); the name just needs to match here.
[[r2_buckets]]
binding = "MATCHES"
bucket_name = "tt11-tracker-matches"
